name: Feature request
description: Suggest an improvement for StreamVault Mobile
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/FabulousTiger/StreamVault-Mobile/blob/main/ROADMAP.md) first, it may already be planned.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Sync / performance, Mobile UI, Sports, Probe & rank, Player, Guide / EPG, Downloads, TV, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: dropdown
    id: device
    attributes:
      label: Mainly for
      options: [Phone, Tablet, TV, All]
